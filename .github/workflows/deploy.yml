name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub request an OIDC token for Azure
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: acrquoteservicedk.azurecr.io
  IMAGE: quote-service
  RESOURCE_GROUP: rg-quote-service
  APP_NAME: ca-quote-service

jobs:
  test:
    name: Test and quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The front end's API client generator runs on the Java set up above.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Front end lint, tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Run tests, coverage and architecture gates
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Runs the backend from test code (fake model) and the API client generator.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Playwright starts the backend (Testcontainers Postgres on the runner's Docker) and ng serve.
      - name: Run end-to-end tests
        working-directory: frontend
        run: |
          chmod +x ../mvnw
          npm run e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  deploy:
    name: Build, push and deploy
    needs: [test, e2e]
    if: github.repository == 'kowalchukdan-lgtm/quote-service'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Azure login (OIDC, no stored credentials)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name acrquoteservicedk
          docker build -t "$REGISTRY/$IMAGE:${{ github.sha }}" .
          docker push "$REGISTRY/$IMAGE:${{ github.sha }}"

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE:${{ github.sha }}" \
            --output none

      - name: Smoke test
        run: |
          URL=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          healthy=false
          for i in $(seq 1 12); do
            if curl -fsS "https://$URL/actuator/health"; then echo; echo "Healthy"; healthy=true; break; fi
            echo "Waiting for app ($i/12)..."; sleep 10
          done
          if [ "$healthy" != true ]; then echo "Health check failed"; exit 1; fi
          # Built-in authentication (Entra ID) gates everything except health: a non-browser
          # client gets 401, for the page and the API alike. Browsers are redirected to sign in.
          for path in / /v1/extractions/ext_SMOKETEST; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://$URL$path")
            if [ "$code" != 401 ]; then echo "Expected 401 without sign-in for $path, got $code"; exit 1; fi
            echo "$path requires sign-in (401)"
          done
