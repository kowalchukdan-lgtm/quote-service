spring.application.name=quote-service

spring.datasource.url=jdbc:postgresql://localhost:5432/quotes
spring.datasource.username=postgres
spring.datasource.password=devpass

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Strict request parsing: the contract sets additionalProperties: false and has no nullable fields.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null
# Reject lenient forms such as an integer epoch-day for a date.
spring.jackson.default-leniency=false

quote.problems.base-uri=https://api.example.com/problems/
